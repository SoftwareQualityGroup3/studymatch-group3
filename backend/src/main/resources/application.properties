spring.application.name=studymatch-backend

# Ligação à BD: apenas por variáveis de ambiente (sem segredos no repositório)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studymatch}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O esquema é gerido pelo Flyway; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
